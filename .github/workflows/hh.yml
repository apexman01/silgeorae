# 단지 세대수(K-apt)만 따로 받기. Actions 탭 > "단지 세대수 받기" > Run workflow
# (매달 자동 갱신에도 같은 단계가 들어 있어요)
name: 단지 세대수 받기

on:
  workflow_dispatch:
  schedule:
    - cron: "41 20 * * *"   # 매일 한국시간 05:41 - 아직 못 받은 단지만 이어서 받음(하루 호출 한도 때문)

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  hh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 단지 세대수 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 scripts/fetch_hh.py
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data/cache
          if git diff --cached --quiet; then echo "바뀐 것 없음"; else
            git commit -m "단지 세대수 갱신 $(date +%Y-%m-%d)"
            git pull --rebase -X theirs origin main || git pull --rebase origin main
            git push
          fi
