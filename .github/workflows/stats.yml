# 구별 현황 숫자만 다시 만들기. Actions 탭 > "구별 현황 숫자" > Run workflow
name: 구별 현황 숫자

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 구별 현황 숫자
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 scripts/build_stats.py
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then echo "바뀐 것 없음"; else
            git commit -m "구별 현황 숫자 갱신 $(date +%Y-%m-%d)"
            git pull --rebase -X theirs origin main || git pull --rebase origin main
            git push
          fi
