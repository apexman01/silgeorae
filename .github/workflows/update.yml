# 매달 실거래가를 자동으로 받아 사이트(docs/data.js)를 갱신합니다.
# 매월 3일 새벽 4시 17분(한국시간)에 실행되고,
# Actions 탭 > "실거래가 자동 갱신" > Run workflow 로 아무 때나 직접 돌릴 수도 있어요.
name: 실거래가 자동 갱신

on:
  schedule:
    - cron: "17 19 2 * *"   # UTC 기준 매월 2일 19:17 = 한국시간 3일 04:17
  workflow_dispatch:
  push:                     # 설정(구·기간)을 바꾸면 바로 다시 받기
    branches: [main]
    paths: ["config.json", "scripts/fetch_molit.py"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 실거래가 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 scripts/fetch_molit.py

      - name: 바뀐 자료 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data/cache
          if git diff --cached --quiet; then
            echo "바뀐 거래 없음"
          else
            git commit -m "실거래가 자동 갱신 $(date +%Y-%m-%d)"
            git push
          fi
