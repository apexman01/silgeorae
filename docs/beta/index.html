<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비상한 아파트 생활권 시험판</title>
<style>
  :root{
    --ink:#1d1f23; --sub:#5b616b; --mute:#9aa0a8; --line:#e6e8eb; --bg:#f6f7f9; --card:#fff;
    --accent:#2a6fdb;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 48px}
  header h1{font-size:22px;margin:0 0 4px;letter-spacing:-.3px}
  header p{margin:0;color:var(--sub);font-size:13.5px}
  .controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin:18px 0 14px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .ctl{display:flex;flex-direction:column;gap:5px}
  .ctl label{font-size:12px;color:var(--sub);font-weight:600}
  select,input[type=text]{font:inherit;font-size:14.5px;padding:8px 10px;border:1px solid #d5d9de;border-radius:8px;background:#fff;color:var(--ink);min-width:120px}
  .seg{display:inline-flex;border:1px solid #d5d9de;border-radius:8px;overflow:hidden}
  .seg button{font:inherit;font-size:14px;border:0;background:#fff;padding:8px 13px;cursor:pointer;color:var(--sub)}
  .seg button+button{border-left:1px solid #d5d9de}
  .seg button.on{background:var(--ink);color:#fff}
  .jb{border-top:1px solid var(--line);padding:12px 0 10px}
  .jb:first-of-type{border-top:0}
  .jb .t{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
  .jb .t b{font-size:16px}
  .jb .hh{color:var(--sub,#6b717a);font-size:13px}
  .jb .bar{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:8px 0 3px}
  .jb .bar i{height:8px;border-radius:3px;background:#e6e8ec}
  .jb .bar i.on{background:#2a6fdb}
  .jb .bar i.now{background:#e8663a}
  .jb .lb{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:11px;color:#8a9099;text-align:center}
  .jb .lb span.now{color:#e8663a;font-weight:700}
  .jb .cur{font-size:13px;margin-top:4px}
  .jbg{margin-top:6px}
  .jbh{position:sticky;top:0;z-index:1;background:#d0606e;color:#fff;border-radius:8px;padding:9px 12px;margin:22px 0 4px;font-weight:700;font-size:15.5px}
  .jbg:first-child .jbh, .jbsum + .jbh{margin-top:10px}
  .jbh span{color:#ffe2e5;font-weight:500;font-size:13px;margin-left:6px}
  .jbh.cur{background:#a3303f}
  .jbh.cur span{color:#ffd6db}
  .jbh.zero{background:#e7b9bd;color:#7a3940}
  .jbh.zero span{color:#8f5359}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 12px;margin-bottom:14px}
  .card h2{font-size:21px;margin:0 0 2px;letter-spacing:-.3px}
  .card .unit{color:var(--sub);font-size:14px;margin:2px 0 6px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px;font-size:14px}
  .legend button{font:inherit;font-size:14px;display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 10px;border:1px solid #d5d9de;border-radius:999px;background:#fff;color:var(--ink);cursor:pointer;min-height:36px}
  .legend button.off{color:#a3a8b0;background:#f3f4f6;border-style:dashed}
  .legend button.off i{background:#c5c9cf!important}
  .legend .lhint{font-size:12px;color:var(--mute);align-self:center}
  tr.off td{opacity:.4}
  .legend i{display:inline-block;width:22px;height:3px;border-radius:2px;position:relative}
  .legend i::after{content:"";position:absolute;left:7px;top:-3px;width:9px;height:9px;border-radius:50%;background:inherit}
  svg{width:100%;height:auto;display:block}
  .foot{color:var(--mute);font-size:12px;line-height:1.55;margin-top:6px}
  .chwrap{position:relative}
  .chwrap svg{touch-action:pan-y}
  .chtip{display:none;position:absolute;z-index:3;min-width:150px;max-width:62%;background:rgba(255,255,255,.96);border:1px solid #d5d9de;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.12);padding:7px 10px;font-size:12.5px;pointer-events:none}
  .chtip .tm{font-weight:700;margin-bottom:3px}
  .chtip .tr{display:flex;align-items:center;gap:6px;margin-top:3px}
  .chtip .tr i{width:9px;height:9px;border-radius:50%;flex:none}
  .chtip .tl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chtip .tr b{white-space:nowrap}
  .chtip .ts{font-size:11px;color:var(--mute);margin-left:15px}
  .chtip .ts:empty{display:none}
  .hc{border-top-left-radius:0}
  .hc ~ .controls{margin-top:0}
  #jbHead .gzt button.on{background:#d0606e;border-color:#d0606e}
  #jbHead .rg{color:#a3303f;background:#fbe4e6}
  body:not([data-tab="top"]) .tt-only, body:not([data-tab="cmp"]) .ct-only, body:not([data-tab="jb"]) .jt-only{display:none!important}
  #jbScope{display:flex;width:max-content;max-width:100%}
  @media(max-width:520px){
    .slot{width:100%;box-sizing:border-box}
    .slot select{flex:1 1 0}
    .slot .sGu{width:auto;flex:0 0 7em}
    .slot .sZone{width:auto}
    #segWin, #jbScope{display:flex;width:100%}
    #segWin button, #jbScope button{flex:1 1 auto;padding:8px 4px}
  }
  .gih{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px;font-size:18px}
  .gih select{font-size:17px;font-weight:700;padding:6px 30px 6px 10px}
  .gih .rg{margin-left:auto;color:#1f56b3;background:#eef3fb;font-size:12.5px;border-radius:999px;padding:4px 10px;font-weight:600}
  .gih .rg:empty{display:none}
  .gi .gst{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .gi .gst div{border-radius:10px;padding:6px 6px;text-align:center;border:1.5px solid}
  .gi .gst div.t1{background:#fdeeef;border-color:#c4505f;color:#9b2c3a}
  .gi .gst div.tp{background:#eef3fb;border-color:#3f6fb8;color:#173a6e}
  .gi .gst div.tr{background:#fdf0e6;border-color:#e0803f;color:#9a4a12}
  .gi .gst div.t4{background:#e9f6f1;border-color:#2f8a6c;color:#0f5a47}
  .gi .gst small{display:block;font-size:11px;white-space:nowrap;letter-spacing:-.3px;opacity:.85}
  .gi .gst b{display:block;font-size:17px;white-space:nowrap}
  .gi .gsrc{font-size:12.5px;margin:6px 1px 0;line-height:1.5}
  .gi .gsrc summary{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;list-style:none}
  .gi .gsrc .gs1{color:var(--mute);font-size:12px}
  .gi .gsrc .gs2{color:#1f56b3;white-space:nowrap;font-size:11px}
  .gi .gsrc[open] .gs2{color:var(--mute)}
  .gi .gsrc summary::-webkit-details-marker{display:none}
  .gi .gsrc > div{margin-top:6px;padding:8px 11px;background:#f6f7f9;border-radius:8px;color:var(--sub);font-size:12.5px}
  .gi .gsrc p{margin:2px 0}
  .gi .gsrc p b{color:var(--ink);font-weight:600;margin-right:6px}
  .gi .ghd{margin:10px 0 0;background:#f5f6f8;border:1px solid #dfe3e8;border-radius:10px;padding:10px 12px;font-size:14.5px;font-weight:500;line-height:1.5}
  .gi .ghd b{font-weight:800}
  .gi .ghd span{display:block;color:var(--sub);font-size:12.5px;font-weight:400;margin-top:8px;padding-top:7px;border-top:1px solid #1d1f23}
  .ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .ch h3{margin:0;font-size:17px}
  .cbtn{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .mini{font:inherit;font-size:12.5px;border:1px solid #cfd4db;background:#fff;color:var(--ink);border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap}
  .capline{text-align:right;margin-top:10px}
  .capt{font:inherit;font-size:10.5px;color:var(--ink);background:none;border:0;padding:4px 2px;cursor:pointer}
  .capt:hover{text-decoration:underline}
  .capt.busy{animation:capspin 1s linear infinite}
  .capb{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:0;background:none;color:#9aa0a8;cursor:pointer;padding:0;flex:none;border-radius:6px}
  .capb:hover,.capb:active{color:#1f56b3;background:#eef3fb}
  .capb.busy{animation:capspin 1s linear infinite;color:#1f56b3}
  @keyframes capspin{50%{opacity:.35}}
  .gih .capb{margin-left:4px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1d1f23;color:#fff;font-size:14px;padding:10px 16px;border-radius:999px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .mini.on{background:#1f56b3;border-color:#1f56b3;color:#fff}
  .ztr + .ztr{margin-top:8px}
  .ch h2{margin:0}
  .zall{border-top:2px solid #1d1f23;margin-top:22px;padding-top:14px}
  .zall h3{margin:0;font-size:19px}
  .legend.sm{gap:6px 10px;font-size:13px}
  .legend.sm span{display:inline-flex;align-items:center;gap:5px}
  .legend.sm i{width:16px}
  .ztr.cur{border-color:#1f56b3;box-shadow:0 0 0 1px #1f56b3 inset}
  .ztr{margin-top:0;border:1px solid #dfe3e8;border-radius:10px;padding:10px 12px}
  .ztr .zh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--sub);font-weight:600}
  .ztr .zh span{font-weight:400;color:var(--mute);font-size:11.5px}
  .ztr .ln{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 2px}
  .ztr .ln i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 8px;border-radius:999px;color:#fff;font-size:12.5px;font-weight:700;box-sizing:border-box}
  .ztr .ln i.n{padding:0;width:24px}
  .ztr .ln i.pl{background:#aab0b9!important}
  .ztr .tm{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:8px}
  .ztr .tm small.ab{font-size:10px;color:var(--mute);letter-spacing:.3px}
  .ztr .tm div{background:#f6f7f9;border-radius:8px;padding:6px 4px;text-align:center}
  .ztr .tm small{display:block;font-size:11px;color:var(--sub)}
  .ztr .tm b{font-size:16px}
  .ztr .tm b em{font-style:normal;font-size:11.5px;font-weight:500;color:var(--sub);margin-left:1px}
  .ztr .nt, #zoneTransit > .nt{font-size:11px;color:var(--mute);margin-top:6px}
  .gi .gzl{margin:14px 0 6px;font-size:12px;color:var(--sub);font-weight:600}
  .gi .gzl span{font-weight:400;color:var(--mute)}
  .gi .gzt{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 2px}
  .gi .gzt button{flex:none;font:inherit;font-size:14px;border:1px solid #d5d9de;background:#fff;border-radius:999px;padding:7px 13px;cursor:pointer;color:var(--ink)}
  .gi .gzt button.on{background:#1f56b3;border-color:#1f56b3;color:#fff;font-weight:600}
  .gi .gzt button.add{color:var(--sub);border-style:dashed}
  .gi .gzt.dim{opacity:.4;pointer-events:none}
  .znote{font-size:15px;color:#3d434b;margin:3px 0 4px;line-height:1.45}
  .seg button{white-space:nowrap}
  @media(max-width:520px){.seg button{padding:8px 10px;font-size:13.5px}}
  @media(max-width:520px){.gi .gst{gap:6px}.gi .gst b{font-size:15px}.gi .gst div{padding:6px 6px}.gi .gst small{font-size:10.5px}}
  .cfoot{margin-top:6px;font-size:12.5px;color:var(--sub);line-height:1.5}
  .cfoot details{display:inline}
  .cfoot summary{display:inline;cursor:pointer;color:#2a6fdb;list-style:none;margin-left:6px;white-space:nowrap}
  .cfoot summary::-webkit-details-marker{display:none}
  .cfoot details[open] summary{color:var(--mute)}
  .cfoot .fd{display:block;margin:6px 0 2px;padding:8px 10px;background:#f6f7f9;border-radius:8px;font-size:12px;color:var(--sub)}
  .cfoot .src{display:block;font-size:11px;color:var(--mute);margin-top:2px}
  .empty{padding:50px 0;text-align:center;color:var(--mute)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th{color:var(--sub);font-weight:600;font-size:12.5px}
  th:first-child,td:first-child{text-align:left}
  #recent th:nth-child(2){text-align:left}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .down{color:#2a6fdb}.up{color:#d9443a}
  .scroll{overflow-x:auto}
  .picker{display:none;margin-top:4px;width:100%}
  .period{width:100%;border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
  .period .head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
  .row3{display:contents}
  @media(max-width:520px){
    .row3{display:grid;grid-template-columns:1.65fr .85fr 1.3fr;gap:7px;width:100%}
    body:not([data-tab="view"]) .row3{grid-template-columns:1fr 1.25fr}
    .row3 .ctl{min-width:0}
    .row3 .seg{display:flex;width:100%}
    .row3 .seg button{flex:1 1 0;padding:8px 1px;font-size:13px;min-width:0;letter-spacing:-.3px}
    #segView button[data-v="top5"]{font-size:11.5px;letter-spacing:-.5px;flex-grow:1.3}
    #segMetric button{font-size:12px;letter-spacing:-.5px}
    .c-area{width:100%}
    #segArea, .period #segPeriod{display:flex;width:100%}
    #segArea button, .period #segPeriod button{flex:1 1 auto;padding:8px 4px}
    .period .head > label{width:100%}
  }
  .period .range-txt{font-size:15px;font-weight:700;margin-left:auto}
  .period .range-txt small{font-weight:400;color:var(--sub);margin-left:6px}
  .dual{position:relative;height:40px;margin:10px 12px 0}
  .dual .track{position:absolute;left:0;right:0;top:18px;height:5px;border-radius:3px;background:#e3e6ea}
  .dual .fill{position:absolute;top:18px;height:5px;border-radius:3px;background:var(--accent)}
  .dual input{position:absolute;left:-12px;width:calc(100% + 24px);top:6px;height:28px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
  .dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .dual input::-moz-range-thumb{pointer-events:auto;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer}
  .dual input::-webkit-slider-runnable-track{background:none}
  .ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin:0 0 0}
  .seg button:disabled{opacity:.35;cursor:default}
  .tabs{display:flex;gap:6px;margin:16px 0 0;flex-wrap:wrap}
  .tabs button{font:inherit;font-size:15px;font-weight:600;padding:10px 16px;border:1px solid #d5d9de;border-bottom:none;border-radius:10px 10px 0 0;background:#eef0f3;color:var(--sub);cursor:pointer;min-height:44px}
  .tabs button.on{background:var(--card);color:var(--ink)}
  @media(max-width:520px){.tabs{gap:3px;flex-wrap:nowrap}.tabs button{font-size:13.5px;padding:9px 8px;flex:1 1 0;white-space:nowrap}}
  .tabs + .controls{margin-top:0;border-top-left-radius:0}
  body[data-tab="cmp"] .v-only, body[data-tab="top"] .v-only, body[data-tab="jb"] .v-only{display:none!important}
  body:not([data-tab="jb"]) .j-only{display:none!important}
  body[data-tab="jb"] .controls > .ctl:not(.j-only), body[data-tab="jb"] .nj, body[data-tab="jb"] .row3{display:none!important}
  .jbsum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--sub);margin:6px 0 4px}
  .jbsum b{color:var(--ink)}
  .jb .go{font:inherit;font-size:12.5px;border:1px solid #d5d9de;background:#fff;border-radius:999px;padding:3px 10px;margin-left:6px;cursor:pointer;color:var(--accent)}
  #jbCard{background:#fff7f7;border:1px solid #efc4c7;border-left:5px solid #d0606e}
  #jbCard h3{color:#8e2a37}
  #jbCard .jb{border-top-color:#f3d7d9}
  .jbtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
  .jbtiles div{background:#fff;border:1px solid #f0cfd2;border-radius:10px;padding:8px 9px}
  .jbtiles small{display:block;font-size:12px;color:var(--sub)}
  .jbtiles div{white-space:nowrap;font-size:12.5px}
  .jbtiles b{font-size:18px;color:#a3303f;margin-right:1px}
  .jbmini{display:flex;flex-wrap:wrap;gap:4px 6px;margin:0 0 8px;font-size:12.5px}
  .jbmini span{background:#fbe4e6;color:#8e2a37;border-radius:999px;padding:3px 9px}
  .jbmini span.late{background:#d0606e;color:#fff}
  .jbrow{display:flex;align-items:center;gap:8px;padding:8px 2px;border-top:1px solid #f3d7d9;font-size:14px}
  .jbrow b{font-weight:600}
  .jbrow .kd{font-size:11.5px;color:var(--sub);white-space:nowrap}
  .jbrow b{min-width:0;word-break:keep-all;overflow-wrap:anywhere}
  .jbrow .st{margin-left:auto;font-size:12px;border-radius:6px;padding:2px 7px;background:#f1f2f4;color:#4b5058;white-space:nowrap}
  .jbrow .st.late{background:#d0606e;color:#fff}
  .jbrow .n{font-size:12.5px;color:var(--sub);white-space:nowrap;min-width:62px;text-align:right}
  .jbmore{font-size:12.5px;color:var(--sub);padding:6px 2px 0}
  #jbGo{width:100%;margin-top:10px;background:#d0606e;border-color:#d0606e;color:#fff}
  body:not([data-tab="cmp"]) .c-only{display:none!important}
  body:not([data-tab="top"]) .t-only{display:none!important}
  body:not([data-tab="view"]) .vt-only{display:none!important}
  .slots{display:flex;flex-wrap:wrap;gap:8px 12px;width:100%}
  .slot{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-left:5px solid;border-radius:10px;padding:6px 8px}
  .slot b{font-size:13px;color:var(--sub);white-space:nowrap}
  .slot select{min-width:0;font-size:14px;padding:6px 8px}
  .slot .sGu{width:6.6em}
  .slot .sZone{width:9.5em}
  .simrow td:first-child{white-space:normal}
  .simrow td:nth-child(2),.simrow td:nth-child(4){text-align:left}
  .simrow input{width:18px;height:18px;accent-color:var(--ink);vertical-align:middle}
  .sum-view{table-layout:fixed;min-width:660px}
  .sum-view th,.sum-view td{padding-left:4px;padding-right:4px}
  .sum-view th,.sum-view td{text-align:left!important;vertical-align:top;white-space:normal}
  .sum-view td b{font-weight:600;display:block}
  .sum-view td small{display:block;font-size:10px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute);margin-top:2px}
  .sum-view td small+small{margin-top:0}
  .sum-view.sum-top{min-width:0}
  #recent th,#recent td{text-align:left!important}
  .barbox{max-height:330px;overflow-y:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:4px 10px;-webkit-overflow-scrolling:touch}
  .barbox.open{max-height:none}
  .barrow{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 5.2em;gap:8px;align-items:center;padding:3px 4px;font-size:13.5px;border-radius:6px}
  .barrow.base{font-weight:700;background:#e8f0fe}
  .barrow.same{background:#fff3d1}
  .barrow.same > span:first-child{font-weight:600;color:#8a5a00}
  .samekey{background:#fff3d1;color:#8a5a00;font-weight:600;border-radius:4px;padding:0 5px}
  tr.same td{background:#fff8e4}
  .baserow td{background:#e8f0fe}
  .replist{margin:8px 0 2px;font-size:12.5px;color:var(--sub);line-height:1.6}
  .replist b{color:var(--ink);font-weight:600}
  #segJb small{font-size:12px;opacity:.75;margin-left:3px}

<script>
const LIFEZONES = window.LIFEZONES || {};

const COLORS = ["#2a6fdb", "#e8663a", "#1aaa72", "#8b5cf6", "#d4a017", "#e04f8c"];
const AREA_BANDS = { "59": [55, 66], "74": [70, 80], "84": [80, 90], "big": [95, 999] };
const LOW_FLOOR = 3;        // 이 층 이하면 '저층'
const MAX_PICK = 6;
const CUSTOM_KEY = "lifezone-custom-v1";

const state = { sido: null, gu: null, zone: 0, type: "sale", area: "84", metric: "max", from: 0, to: 0, presale: true, picked: [], hidden: new Set(), view: "zone", customPeriod: false };
const INDEX = window.DATA_INDEX || { regions: {}, months: [] };
let DATA = null, PRESALE = [], CX = [];
function srcRows() { return state.type === "sale" ? (state.presale ? DATA.sale.concat(PRESALE) : DATA.sale) : DATA.jeonse; }
const $ = id => document.getElementById(id);
const norm = s => String(s).replace(/\s+/g, "").toLowerCase();

/* ---------- 데이터: 구를 고를 때 그 구 파일만 불러오기 ---------- */
const allMonths = INDEX.months;
const GU_KEY = "lifezone-last-gu";
function loadGu(sido, gu, done) {
  const code = (INDEX.regions[sido] || {})[gu];
  const use = () => {
    DATA = window.DATA_GU[gu];
    CX = DATA.complexes.map((c, i) => ({ i, name: c[0], sido: c[1], gu: c[2], dong: c[3], built: c[4] }));
    PRESALE = (DATA.presale || []).map(r => [r[0], r[1], r[2], r[3], r[4], r[5], r[6] ? "입주권" : "분양권"]);
    try { localStorage.setItem(GU_KEY, gu); } catch (e) {}
    done();
  };
  window.DATA_GU = window.DATA_GU || {};
  if (window.DATA_GU[gu]) return use();
  $("chartCard").innerHTML = `<div class="empty">${gu} 자료 불러오는 중…</div>`;
  const s = document.createElement("script");
  s.src = `../data/${code}.js?v=${INDEX.updated || Date.now()}`;
  s.onload = use;
  s.onerror = () => { $("chartCard").innerHTML = `<div class="empty">${gu} 자료를 불러오지 못했어요. 새로고침해 보세요.</div>`; };
  document.head.appendChild(s);
}
function visMonths() { return allMonths.slice(state.from, state.to + 1); }
const fmtYM = ym => `${String(ym).slice(2, 4)}.${+String(ym).slice(4)}`;
$("dataInfo").textContent =
  `국토부 실거래가 · 계약일 기준 ${fmtYM(allMonths[0])}~${fmtYM(allMonths[allMonths.length - 1])}` +
  (INDEX.updated ? ` · ${INDEX.updated} 갱신` : "") + ` · 매매는 해제·직거래 제외, 전세 그래프는 신규 계약만`;

/* ---------- 내 생활권(브라우저 저장) ---------- */
function loadCustom() { try { return JSON.parse(localStorage.getItem(CUSTOM_KEY)) || {}; } catch (e) { return {}; } }
function saveCustom(obj) { try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(obj)); return true; } catch (e) { return false; } }

function zonesFor(sido, gu) {
  const base = ((LIFEZONES[sido] || {})[gu] || []).map(z => ({ ...z, kind: "base" }));
  const custom = ((loadCustom()[sido] || {})[gu] || []).map(z => ({ ...z, kind: "custom" }));
  return [...base, ...custom, { name: "＋ 단지 직접 고르기", kind: "pick", complexes: [] }];
}

/* ---------- 선택 박스 ---------- */
function fillSelect(sel, items, val) {
  sel.innerHTML = items.map((t, i) => `<option value="${i}">${t}</option>`).join("");
  sel.value = val;
}
function initSido() {
  const sidos = Object.keys(INDEX.regions);
  state.sido = sidos[0];
  fillSelect($("selSido"), sidos, 0); $("selSido").style.display = sidos.length > 1 ? "" : "none";
  $("selSido").onchange = e => { state.sido = sidos[+e.target.value]; initGu(); };
  initGu();
}
function initGu() {
  const gus = Object.keys(INDEX.regions[state.sido] || {}).sort();
  let last = null; try { last = localStorage.getItem(GU_KEY); } catch (e) {}
  const gi = Math.max(0, gus.indexOf(last));
  state.gu = gus[gi];
  fillSelect($("selGu"), gus, gi);
  $("selGu").onchange = e => { state.gu = gus[+e.target.value]; state.zone = 0; state.picked = []; loadGu(state.sido, state.gu, () => initZone()); };
  loadGu(state.sido, state.gu, () => initZone());
}
function initZone(keep) {
  const zs = zonesFor(state.sido, state.gu);
  if (!keep || state.zone >= zs.length) state.zone = 0;
  fillSelect($("selZone"), zs.map(z => (z.kind === "custom" ? "★ " : "") + z.name), state.zone);
  $("selZone").onchange = e => { state.zone = +e.target.value; onZoneChange(); };
  onZoneChange();
}
function shiftYm(ym, k) { let y = +String(ym).slice(0, 4), m = +String(ym).slice(4, 6) + k; while (m <= 0) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}${String(m).padStart(2, "0")}`; }
let TR_ALL = false;
function transitBox(gu, zz, cur) {
  const T = window.TRANSIT, d = T && T.zones[gu + "|" + zz.name];
  if (!d) return "";
  const badge = (l, pl) => { const short = /^\d$/.test(l); return `<i class="${short ? "n" : ""}${pl ? " pl" : ""}" style="background:${T.colors[l] || "#888"}" title="${l}${pl ? " (예정)" : ""}">${l}${pl ? " 예정" : ""}</i>`; };
  return `<div class="ztr${cur ? " cur" : ""}"><div class="zh">${zz.name}<span>${d.st}</span></div>
    <div class="ln">${d.lines.map(l => badge(l)).join("")}${(d.plan || []).map(([l]) => badge(l, true)).join("")}</div>
    <div class="tm">${(T.dest || []).map(([nm, ab], i) => `<div><small>${nm}</small><b>${d.t[i]}<em>분</em></b><small class="ab">${ab}</small></div>`).join("")}</div>
    ${(d.plan || []).length ? `<div class="nt">회색 = 예정 노선: ${d.plan.map(([l, st]) => `${l}(${st})`).join(", ")}</div>` : ""}</div>`;
}
function renderTransit(z) {   // 생활권 교통 카드: 선택 생활권(또는 전체 펼치기) — 노선 뱃지(예정은 회색) + 주요 업무지구까지 시간
  const card = $("trCard"), T = window.TRANSIT;
  const zs = baseZones(state.gu).filter(zz => T && T.zones[state.gu + "|" + zz.name]);
  if (!zs.length || state.view === "top5") { card.style.display = "none"; return; }
  const curName = z && z.kind === "base" ? z.name : null;
  const list = TR_ALL ? zs : zs.filter(zz => zz.name === curName);
  $("zoneTransit").innerHTML = (list.length ? list.map(zz => transitBox(state.gu, zz, TR_ALL && zz.name === curName)).join("") : `<div class="hint">직접 고른 단지는 교통 정보가 없어요. '전체 생활권 펼치기'로 이 구의 생활권 교통을 볼 수 있어요.</div>`)

    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"; sc.onload = () => ok(window.html2canvas); sc.onerror = no; document.head.appendChild(sc); }));

async function shotSave(el, name, btn, fixClone) {   // 화면 요소를 사진으로 저장 (카드 저장·한 장 이미지 공통)

    const h2c = await loadH2C();
    const cv = await h2c(el, { scale: 2, backgroundColor: "#ffffff", useCORS: true,
      onclone: doc => {   // 접힌 'ⓘ 설명' 내용이 사진에 겹쳐 찍히지 않게 지움
        doc.querySelectorAll("details:not([open])").forEach(d => [...d.children].forEach(c => { if (c.tagName !== "SUMMARY") c.remove(); }));
        doc.querySelectorAll(".chtip").forEach(t => t.remove());
        doc.querySelectorAll(".hov").forEach(h => h.remove());
        doc.querySelectorAll(".scroll").forEach(x => { x.style.overflow = "visible"; });   // 옆으로 넘치는 표도 다 찍히게
        if (fixClone) fixClone(doc);

    if (ios && navigator.canShare && navigator.canShare({ files: [file] })) {

    } else {
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);

    }

  btn.classList.remove("busy");
}

[["jbScope", "scope"], ["jbStage", "stage"], ["jbType", "type"], ["jbSort", "sort"]].forEach(([id, k]) => {
  $(id).querySelectorAll("button").forEach(b => b.onclick = () => {
    $(id).querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); jbS[k] = b.dataset.v;
    if (k === "scope") renderJbSel(); render();
  });
});
function jbKind(r) { return r.type.includes("재건축") ? "재건축" : "재개발"; }
function jbFilter(l) {
  const si = JB.stages.indexOf(jbS.stage);
  return l.filter(r => (jbS.stage === "all" || JB.stages.indexOf(r.stage) >= si) && (jbS.type === "all" || jbKind(r) === jbS.type));
}
function jbSortL(l) {
  const st = r => JB.stages.indexOf(r.stage);
  return l.slice().sort(jbS.sort === "hh" ? (a, b) => b.new - a.new : (a, b) => st(b) - st(a) || b.new - a.new);
}
function jbItemLink(r, gu, zi, zname) {
  const h = jbItem(r);
  const tag = zname ? `<button class="go" type="button" data-gu="${gu}" data-zi="${zi}">${zname} 시세 보기</button>` : "";
  return h.replace('<div class="cur">', `<div class="cur">`).replace(/<\/div><\/div>$/, `${tag}</div></div>`);
}
let jbTok = 0;   // 늦게 끝난 이전 불러오기(예: 서울 전체)가 지금 화면을 덮어쓰지 않게
function renderJbTab() {
  const card = $("chartCard");
  const gus = jbS.scope === "seoul" ? jbGus() : [jbS.gu];
  const tok = ++jbTok, want = jbS.scope + "|" + jbS.gu;
  card.innerHTML = `<div class="empty">자료 불러오는 중…</div>`;
  ensureAll(gus, () => {
    if (tok !== jbTok || state.tab !== "jb" || want !== jbS.scope + "|" + jbS.gu) return;
    const groups = [];   // [제목, [{r, gu, zi, zname}], 강조]
    let all = [];
    gus.forEach(gu => {
      const P = prep(gu); if (!P) return;
      const zones = baseZones(gu), { res, none } = jbAssign(gu, P.cx);
      res.forEach((l, zi) => l.forEach(r => all.push({ r, gu, zi, zname: zones[zi].name })));
      none.forEach(r => all.push({ r, gu, zi: -1, zname: "" }));
    });
    const before = all.length;
    const keep = new Set(jbFilter(all.map(o => o.r)));
    all = all.filter(o => keep.has(o.r));
    const sortO = l => { const s = jbSortL(l.map(o => o.r)); return s.map(r => l.find(o => o.r === r)); };
    let title, sub;
    if (jbS.scope !== "seoul") all = all.filter(o => o.gu === jbS.gu);
    if (jbS.scope === "zone") {
      const zn = baseZones(jbS.gu)[jbS.zi].name;
      title = `${jbS.gu} · ${zn} 정비사업`;
      groups.push([null, sortO(all.filter(o => o.zi === jbS.zi)), false]);
    } else if (jbS.scope === "gu") {
      title = `${jbS.gu} 정비사업 · 생활권별`;
      baseZones(jbS.gu).forEach((z, zi) => groups.push([z.name, sortO(all.filter(o => o.zi === zi)), false]));
      const nn = all.filter(o => o.zi < 0); if (nn.length) groups.push(["생활권에 못 붙인 구역", sortO(nn), false]);
    } else {
      title = `서울 전체 정비사업 · 구별`;
      gus.forEach(gu => { const l = all.filter(o => o.gu === gu); if (l.length) groups.push([gu, sortO(l), false]); });
    }
    const shownL = groups.flatMap(g => g[1]);
    const cnt = {}; shownL.forEach(o => cnt[o.r.stage] = (cnt[o.r.stage] || 0) + 1);
    const hhSum = shownL.reduce((s, o) => s + o.r.new, 0);
    const filt = [jbS.stage !== "all" ? `${jbS.stage} 이후` : "", jbS.type !== "all" ? jbS.type : ""].filter(Boolean).join(" · ");
    let html = `<h2>${title}</h2><div class="hint" style="margin:2px 0 4px">${filt ? filt + " · " : ""}${jbS.sort === "hh" ? "세대수 큰 순" : "단계 빠른 순"}</div>
      <div class="jbsum"><span><b>${shownL.length}개 구역</b>${filt ? ` / 전체 ${before}` : ""}</span><span>공급 <b>${hhSum.toLocaleString()}세대</b></span>${JB.stages.slice().reverse().filter(s => cnt[s]).map(s => `<span>${s} ${cnt[s]}</span>`).join("")}</div>`;
    html += groups.map(([nm, l]) => `${nm ? `<div class="jbh${l.length ? "" : " zero"}">${nm} <span>${l.length}개 구역</span></div>` : ""}${l.length ? l.map(o => jbItemLink(o.r, o.gu, o.zi, jbS.scope === "zone" ? "" : (jbS.scope === "seoul" ? (o.zname ? `${o.zname}` : "") : o.zname))).join("") : `<div class="hint" style="padding:6px 0 10px">조건에 맞는 구역 없음</div>`}`).join("");
    html += `<div class="foot">${JB.src} · ${JB.asof ? `${JB.asof.slice(2, 4)}년 ${+JB.asof.slice(5, 7)}월말 기준` : ""} · 착공 전까지 진행 중인 구역만 · 공급 0세대 구역 제외 · '시세 보기'를 누르면 그 생활권 시세 그래프로 이동</div>`;
    card.innerHTML = html;
    card.querySelectorAll(".go").forEach(b => b.onclick = () => goZone(b.dataset.gu, +b.dataset.zi));
  });
}
function goZone(gu, zi) {
  const gus = Object.keys(INDEX.regions[state.sido] || {}).sort();
  state.gu = gu; state.picked = []; $("selGu").value = gus.indexOf(gu);
  loadGu(state.sido, gu, () => { initZone(); state.zone = Math.max(0, zi); $("selZone").value = state.zone; setTab("view"); onZoneChange(); window.scrollTo(0, 0); });
}
$("tabs").querySelectorAll("button").forEach(b => b.onclick = () => setTab(b.dataset.t));
setRange(Math.max(0, N - 12), N - 1);
initSido();
showPeriod();
let _rw = 0; window.addEventListener("resize", () => { const w = $("chartCard").clientWidth; if (Math.abs(w - _rw) > 40) { _rw = w; render(); } });
</script>
