<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상승·하락 시험판</title>
<link rel="stylesheet" href="x.css">
<style>
  .phase{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
  .phase div{border-radius:12px;padding:9px 8px;background:var(--card);border:1px solid var(--line)}
  .phase small{display:block;font-size:11.5px;color:var(--sub)}
  .phase b{font-size:22px;letter-spacing:-.4px}
  .phase .p1 b{color:var(--up)} .phase .p3 b{color:var(--down)} .phase .p4 b{color:var(--mute)}
  .phase small{line-height:1.3}
  .phase .why{font-size:11.5px;color:var(--sub);margin-top:6px;line-height:1.5;border:0;padding:0;background:none;border-radius:0}
  .phase .bar3{padding:0;border:0;border-radius:4px;background:#eef0f3}
  .bar3{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 0}
  .bar3 i{display:block;height:100%;transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute);margin:0 0 2px 0}
  .row{display:grid;grid-template-columns:76px 1fr 58px;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .row .nm{font-size:13.5px;font-weight:600;line-height:1.25;min-width:0}
  .row .nm small{display:block;font-size:11px;color:var(--mute);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .v{text-align:right;font-size:13px;font-weight:700}
  .row .v small{display:block;font-size:10.5px;color:var(--mute);font-weight:500}
  .row.cx{grid-template-columns:1fr 64px;row-gap:4px}
  .row.cx .db{grid-column:1/3}
  .row.cx .nm b{font-size:14px}
  .row.cx .nums{grid-column:1/3;display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub)}
  .row .pk100{position:absolute;top:0;bottom:0;width:1px;background:#d9443a;opacity:.35}
  .dbw{position:relative}
  .ctl{display:grid;gap:8px;margin-bottom:10px}
  .ctl .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  select{font-size:14px;padding:7px 8px;border:1px solid #d5d9de;border-radius:8px;background:#fff;color:var(--ink);width:100%}
  .jbl{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}
  .jbt{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:6px}
  .jbt small{display:block;font-weight:500;font-size:11.5px;color:var(--mute);margin-top:2px}
  a.jbtag{display:inline-block;margin:0 4px 6px 0;padding:4px 9px;font-size:12.5px;border-radius:999px;background:#eef0f3;color:#5b616b;text-decoration:none}
  a.jbtag small{color:var(--mute);margin-left:2px}
  .rq{width:100%;font-size:16px;padding:10px 12px;border:1px solid #d5d9de;border-radius:10px;background:#fff;margin-bottom:6px}
  #rsug button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:#fff;padding:9px 4px;font-size:14px}
  #rsug button small{color:var(--mute);font-size:12px;margin-left:4px}
  .rp .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:8px 0 4px}
  .rp .hd b{font-size:17px}
  .rp .hd small{font-size:12px;color:var(--sub)}
  .rp table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;table-layout:fixed}
  .rp th,.rp td{padding:7px 4px;border-top:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
  .rp th{font-weight:600;color:var(--sub);font-size:12px}
  .rp td b{font-size:14px}
  .rp td small{display:block;font-size:11px;color:var(--mute)}
  .rp .na{font-size:13.5px;color:var(--sub);background:var(--bg);border-radius:10px;padding:10px;margin-top:8px}
  .sub2{font-size:11.5px;color:var(--sub);margin-top:2px}
  .more{display:block;width:100%;margin-top:8px;border:1px solid #d5d9de;background:#fff;border-radius:10px;padding:9px;color:var(--sub);font-size:13.5px}
  .key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--sub);margin:0 0 8px}
  .key i{display:inline-block;vertical-align:middle;margin-right:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>상승·하락 <span class="tag pre">시험판</span></h1><span class="meta" id="meta"></span></div>
  <p class="lead">2021~22년 전고점에서 얼마나 떨어졌다가 지금 어디까지 왔는지 봅니다. 전고점을 넘었으면 상승기, 전저점 근처면 아직 바닥권입니다.</p>

  <div class="phase rise" id="phase"></div>

  <div class="card rise" style="animation-delay:.1s">
    <h2>구별 사이클 <small>84㎡ · 전고점 = 100</small></h2>
    <div class="key"><span><i style="width:16px;height:6px;border-radius:3px;background:linear-gradient(90deg,#b9cdf3,#f3b9b4)"></i>전저점~전고점</span><span><i style="width:10px;height:10px;border-radius:50%;background:#d9443a"></i>지금(전고점 위)</span><span><i style="width:10px;height:10px;border-radius:50%;background:#1d1f23"></i>지금(회복 중)</span></div>
    <div class="seg" id="segGuSort" style="margin-bottom:8px"><button data-v="rec">회복률 순</button><button data-v="peak">전고점 대비 순</button></div>
    <div class="scale" id="guScale" style="margin-left:84px;margin-right:66px"></div>
    <div id="guRows"></div>
  </div>

  <div class="card rise" style="animation-delay:.12s" id="repCard">
    <h2>단지 사이클 성적표 <small>같은 생활권 평균과 비교</small></h2>
    <input id="rq" class="rq" type="search" placeholder="단지 이름·초성 (예: 고덕, ㄱㄷㄱㄹ)" autocomplete="off">
    <div id="rsug"></div><div id="rep"></div>
  </div>

  <div class="card rise" style="animation-delay:.16s">
    <h2>단지별 <small>생활권 대표 단지 · 시세 = 4층 이상 최근 3건 중간값</small></h2>
    <div class="ctl">
      <div class="two"><select id="selGu"></select><div class="seg" id="segArea"><button data-v="84">84㎡</button><button data-v="59">59㎡</button></div></div>
      <div class="seg" id="segCx"><button data-v="break">전고점 돌파</button><button data-v="lag">고점 아래</button><button data-v="all">전체(고점대비)</button></div>
    </div>
    <div id="cxSum" style="font-size:13px;color:var(--sub);margin-bottom:6px"></div>
    <div id="cxRows"></div>
  </div>
  <p class="foot" id="foot"></p>
</div>
<script src="x.js"></script>
<script src="nav.js"></script>
<script>
const $ = id => document.getElementById(id);
const q = X.qs();
const S = Object.assign({ guSort: "rec", gu: "", area: "84", cx: "break" }, X.store.get("silgeorae_cycle_v1", {}), q.gu ? { gu: q.gu } : {});
const save = () => X.store.set("silgeorae_cycle_v1", S);
let G, C, CY, LIMIT = 30;

Promise.all([X.get("data/x/gu.json"), X.get("data/x/cx.json"), X.get("data/x/cycle.json")]).then(([g, c, cy]) => {
  G = g; C = c; CY = cy;
  $("meta").textContent = `기준 ${X.ym(g.확정월)} (${X.ym(g.잠정월)} 잠정)`;
  const gus = Object.keys(g.구).sort();
  $("selGu").innerHTML = `<option value="">서울 전체</option>` + gus.map(x => `<option${x === S.gu ? " selected" : ""}>${x}</option>`).join("");
  $("foot").innerHTML = `자료: 국토부 실거래가(매매는 해제·직거래 제외, 분양권·입주권 포함).<br>` +
    `· 전고점 = 2021~22년 <b>일반 매매</b> 최고가, 전저점 = 전고점 이후 일반 매매 최저가(2건 이상이면 가장 낮은 1건은 급매로 보고 뺌). 분양권·입주권은 분양가·조합원 가격이라 사이클 판단에서 뺍니다.<br>` +
    `· <b>판단 불가</b> = 신축·분양권만(2021~22 일반 매매 2건 미만, 분양권만 있었음) · 거래 2건 미만(구축인데 2021~22 일반 매매 부족) · 저≥고(전고점 뒤 최저가가 전고점보다 높음). 신축(입주권 시절)(거래 절반 이상이 입주권이었지만 이미 준공). <b>정비사업 진행</b> = 거래 절반 이상이 입주권이고 아직 준공 전. 모두 순위·회복률에서 뺍니다.<br>` +
    `· 구 단위 지금 값은 <b>${X.ym(g.확정월)}</b> 기준입니다. 마지막 달(${X.ym(g.잠정월)})은 신고기한(30일)이 남아 거래가 덜 들어와 '잠정'으로 봅니다.<br>` +
    `· 회복률 = (지금 − 전저점) ÷ (전고점 − 전저점). 100% 넘으면 전고점 돌파.<br>` +
    `· 구 단위는 구 전체 84㎡ 거래의 3개월 이동 중간값으로 계산해 단지 단위와 숫자가 다를 수 있습니다.`;
  renderPhase(); renderGu(); renderCx(); initRep();
}).catch(e => { $("guRows").innerHTML = `<div class="empty">자료를 불러오지 못했습니다.</div>`; console.error(e); });

function cxNA(jb) {   // 시세는 있지만 사이클 판단을 못 하는 단지 (jb=true: 입주권 위주 = 정비사업 진행 단지만, false: 그 밖의 판단 불가)
  const out = [];
  C.생활권.forEach(z => (C.단지[z.구][z.이름] || []).forEach(c => { const a = c[S.area]; if (a && a.시세 && a.사이클 && a.사이클.판정 !== "가능" && (a.사이클.이유 === "입주권") === !!jb) out.push({ z, c, a, why: a.사이클.이유 }); }));
  return out;
}
const lzLink = (z, tab) => `./?gu=${encodeURIComponent(z.구)}&lz=${encodeURIComponent(z.id || z.이름)}&tab=${tab}`;
function cxList() {
  const out = [];
  C.생활권.forEach(z => (C.단지[z.구][z.이름] || []).forEach(c => {
    const a = c[S.area]; if (!a || !a.전고점 || !a.전저점 || !a.시세 || (a.사이클 && a.사이클.판정 !== "가능")) return;
    const pk = a.전고점[0], lo = a.전저점[0], cur = a.시세;
    out.push({ z, c, a, pk, lo, cur, rec: pk > lo ? (cur - lo) / (pk - lo) * 100 : null, vs: (cur / pk - 1) * 100 });
  }));
  return out;
}
function renderPhase() {
  const L = cxList(), NA = cxNA(false), JBL = cxNA(true); const n1 = L.filter(x => x.cur > x.pk).length, n3 = L.filter(x => x.rec != null && x.rec < 40).length, n2 = L.length - n1 - n3, n4 = NA.length, n5 = JBL.length, all = L.length + n4 + n5;
  $("phase").innerHTML = `<div class="p1"><small>전고점<br>돌파</small><b class="num" id="ph1">0</b></div>` +
    `<div class="p2"><small>회복 중<br>(40%~)</small><b class="num" id="ph2">0</b></div>` +
    `<div class="p3"><small>바닥권<br>(40% 미만)</small><b class="num" id="ph3">0</b></div>` +
    `<div class="p4"><small>판단<br>불가</small><b class="num" id="ph4">0</b></div>`;
  [["ph1", n1], ["ph2", n2], ["ph3", n3], ["ph4", n4]].forEach(([id, v]) => X.count($(id), v, x => Math.round(x)));
  const wc = {}; NA.forEach(x => wc[x.why] = (wc[x.why] || 0) + 1);
  const WN = { "신축": "신축·분양권만", "신축입주권": "신축(입주권 시절)", "거래부족": "거래 2건 미만", "저≥고": "저≥고" };
  $("phase").insertAdjacentHTML("beforeend", `<div style="grid-column:1/5;padding:8px 10px"><small>${S.area}㎡ 대표 단지 <b style="color:var(--ink)">${all}곳</b> = 돌파 ${n1} + 회복 중 ${n2} + 바닥권 ${n3} + 판단 불가 ${n4} + 정비사업 진행 ${n5}</small>` +
    `<div class="bar3"><i style="width:0;background:var(--up)"></i><i style="width:0;background:#c9ced4"></i><i style="width:0;background:var(--down)"></i><i style="width:0;background:#e4e6e9"></i><i style="width:0;background:#b9bec6"></i></div>` +
    (n4 ? `<div class="why">판단 불가 ${n4}곳: ${Object.keys(WN).filter(k => wc[k]).map(k => `${WN[k]} ${wc[k]}`).join(" · ")} <span style="color:var(--mute)">(아래 설명 참고)</span></div>` : "") +
    (n5 ? `<div class="why">정비사업 진행 ${n5}곳: 아직 준공 전, 거래 절반 이상이 입주권 (단지별 목록 맨 아래)</div>` : "") + `</div>`);
  { const is = $("phase").querySelectorAll(".bar3 i"); [n1, n2, n3, n4, n5].forEach((v, i) => is[i].style.width = (v / all * 100) + "%"); }
}
const AX = [60, 130];   // 전고점=100 기준 축
const P = v => (v - AX[0]) / (AX[1] - AX[0]) * 100;
function scaleHtml() { return [60, 70, 80, 90, 100, 110, 120, 130].map(v => `<span>${v}</span>`).join(""); }
function rel(pk, v) { return Math.max(AX[0], Math.min(AX[1], v / pk * 100)); }

function renderGu() {
  $("segGuSort").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === S.guSort));
  $("guScale").innerHTML = scaleHtml();
  const rows = Object.entries(G.구).filter(([, d]) => d.전고점 && d.현재).sort((a, b) => S.guSort === "rec" ? (b[1].회복률 ?? -1) - (a[1].회복률 ?? -1) : b[1].고점대비 - a[1].고점대비);
  $("guRows").innerHTML = rows.map(([gu, d], i) => {
    const pk = d.전고점;
    const cls = d.현재 > pk ? "up" : "";
    return `<div class="row" style="animation-delay:${i * 20}ms"><div class="nm">${gu}<small>${X.eok1(d.전저점)} → ${X.eok1(d.현재)}</small></div>` +
      `<div class="dbw"><span class="pk100" style="left:${P(100)}%"></span>${X.dumbbell(100, rel(pk, d.전저점 || pk), rel(pk, d.현재), AX[0], AX[1]).replace('class="cur "', `class="cur ${cls}"`)}</div>` +
      `<div class="v num ${cls}">${S.guSort === "rec" ? (d.회복률 == null ? "-" : d.회복률.toFixed(0) + "%") : X.pct(d.고점대비, 0)}<small>${S.guSort === "rec" ? "회복률" : "고점대비"}</small></div></div>`;
  }).join("");
}

const zKey = z => z.id || z.구 + "|" + z.이름;
function cyOf(z, c, A) { const Z = CY && CY.생활권[zKey(z)], d = Z && Z[A]; return d ? { Z: d, me: d.단지.find(y => y.id === c.id) } : null; }
function cyLine(x) {
  const r = cyOf(x.z, x.c, S.area); if (!r || !r.me) return "";
  const n = r.Z.단지.length;
  return `<div class="sub2" style="grid-column:1/3">하락기 거래 <b>${r.me.거래}건</b> (생활권 ${n}곳 중 ${r.me.거래순위}위) · 저점 뒤 상승 <b class="${r.me.상승률 > 0 ? "up" : "down"}">${X.pct(r.me.상승률, 0)}</b> (생활권 ${r.me.상승률순위}위)</div>`;
}
function renderCx() {
  $("segArea").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === S.area));
  $("segCx").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === S.cx));
  let L = cxList().filter(x => !S.gu || x.z.구 === S.gu);
  const total = L.length, naN = cxNA(false).filter(x => !S.gu || x.z.구 === S.gu).length, JB = cxNA(true).filter(x => !S.gu || x.z.구 === S.gu);
  if (S.cx === "break") L = L.filter(x => x.cur > x.pk).sort((a, b) => b.vs - a.vs);
  else if (S.cx === "lag") L = L.filter(x => x.cur <= x.pk).sort((a, b) => a.vs - b.vs);
  else L = L.sort((a, b) => b.vs - a.vs);
  $("cxSum").innerHTML = `${S.gu || "서울 전체"} ${S.area}㎡ 대표 단지 ${total}곳 중 <b style="color:var(--ink)">${L.length}곳</b>` +
    (S.cx === "break" ? " 전고점 돌파 (많이 넘은 순)" : S.cx === "lag" ? " 아직 전고점 아래 (많이 빠진 순)" : "") +
    (naN ? `<br><span style="font-size:12px;color:var(--mute)">판단 불가 ${naN}곳은 목록에서 뺐습니다</span>` : "");
  const jbHtml = JB.length ? `<div class="jbl"><div class="jbt">정비사업 진행 <small>${JB.length}곳 · 거래 대부분이 입주권이라 순위·회복률에서 뺌 · 누르면 그 생활권 정비사업 탭</small></div>` +
    JB.map(x => `<a class="tag jbtag" href="${lzLink(x.z, "jb")}">${X.esc(x.c.이름)} <small>${x.z.구}</small></a>`).join("") + `</div>` : "";
  if (!L.length) { $("cxRows").innerHTML = `<div class="empty">해당하는 단지가 없습니다.</div>` + jbHtml; return; }
  $("cxRows").innerHTML = `<div class="scale">${scaleHtml()}</div>` + L.slice(0, LIMIT).map(x => {
    const cls = x.cur > x.pk ? "up" : "";
    return `<div class="row cx"><div class="nm"><b>${X.esc(x.c.이름)}</b>${x.a.확정전 ? ' <span class="tag old">이번 달 거래 포함</span>' : ""}<small>${x.z.구} ${X.esc(x.z.이름)} · ${x.c.준공 || "-"}년${x.c.세대수 ? " · " + x.c.세대수.toLocaleString() + "세대" : ""}</small></div>` +
      `<div class="v num ${cls}">${X.pct(x.vs, 0)}<small>고점대비</small></div>` +
      `<div class="dbw" style="grid-column:1/3"><span class="pk100" style="left:${P(100)}%"></span>${X.dumbbell(100, rel(x.pk, x.lo), rel(x.pk, x.cur), AX[0], AX[1]).replace('class="cur "', `class="cur ${cls}"`)}</div>` +
      cyLine(x) + `<div class="nums"><span>고 ${X.eok(x.pk)} <small>${X.ym(Math.floor(x.a.전고점[1] / 100))}</small></span><span>저 ${X.eok(x.lo)} <small>${X.ym(Math.floor(x.a.전저점[1] / 100))}</small></span><span><b style="color:var(--ink)">지금 ${X.eok(x.cur)}</b></span></div></div>`;
  }).join("") + (L.length > LIMIT ? `<button class="more" id="more">더 보기 (${L.length - LIMIT}곳 더)</button>` : "") + jbHtml;
  const m = $("more"); if (m) m.onclick = () => { LIMIT += 30; renderCx(); };
}

// 단지 사이클 성적표: 검색 → 이 단지 vs 같은 생활권 평균 (낙폭·하락기 거래·상승률·회복률) + 서울 순위
let RALL = [];
function initRep() {
  C.생활권.forEach(z => (C.단지[z.구][z.이름] || []).forEach(c => RALL.push({ z, c, key: X.nz(c.이름 + c.검색명 + z.이름), ch: X.cho(X.nz(c.이름 + c.검색명)) })));
  const saved = X.store.get("silgeorae_cycle_rep", null), q = X.qs();
  const pickId = q.cx || saved;
  const hit = pickId && RALL.find(r => r.c.id === pickId);
  if (hit) showRep(hit);
  $("rq").oninput = () => {
    const t = X.nz($("rq").value), isC = /^[ㄱ-ㅎ]+$/.test(t);
    const r = t ? RALL.filter(x => isC ? x.ch.includes(t) : x.key.includes(t)).slice(0, 8) : [];
    $("rsug").innerHTML = r.map(x => `<button data-id="${X.esc(x.c.id)}">${X.esc(x.c.이름)}<small>${x.z.구} ${X.esc(x.z.이름)}</small></button>`).join("");
  };
  $("rsug").onclick = e => { const b = e.target.closest("button"); if (!b) return; const x = RALL.find(r => r.c.id === b.dataset.id); $("rq").value = ""; $("rsug").innerHTML = ""; X.store.set("silgeorae_cycle_rep", x.c.id); showRep(x); };
}
function seoulRank(A, key, val) {   // 서울 전체 대표 단지 중 순위 (큰 값이 1위)
  const all = []; Object.values(CY.생활권).forEach(Z => Z[A] && Z[A].단지.forEach(y => all.push(y[key])));
  return { n: all.length, r: all.filter(v => v > val).length + 1 };
}
function showRep(x) {
  const A = x.c[S.area] ? S.area : (x.c["84"] ? "84" : "59"), a = x.c[A], r = cyOf(x.z, x.c, A);
  let h = `<div class="rp"><div class="hd"><b>${X.esc(x.c.이름)} <span class="tag">${A}㎡</span></b><small>${x.z.구} ${X.esc(x.z.이름)}</small></div>`;
  if (!r || !r.me) {
    const why = a && a.사이클 ? ({ "신축": "신축·분양권만", "신축입주권": "신축(입주권 시절)", "입주권": "정비사업 진행(아직 준공 전)", "거래부족": "2021~22 일반 매매 2건 미만", "저≥고": "전고점 뒤 최저가가 전고점보다 높음" }[a.사이클.이유] || "") : "거래 없음";
    h += `<div class="na">사이클 판단 불가 — ${why}. 순위·평균 비교에서 뺍니다.</div></div>`;
    $("rep").innerHTML = h; return;
  }
  const m = r.me, av = r.Z.평균, n = r.Z.단지.length, sR = seoulRank(A, "상승률", m.상승률), sD = seoulRank(A, "낙폭", m.낙폭);
  const cmp = (v, w, unit, good) => { const d = v - w; const cls = d === 0 ? "" : (good ? d > 0 : d < 0) ? "up" : "down"; return `<small class="${cls}">평균보다 ${d > 0 ? "+" : ""}${Math.round(d * 10) / 10}${unit}</small>`; };
  h += X.dumbbell(m.고, m.저, m.지금, Math.min(m.저, m.지금) * 0.93, Math.max(m.고, m.지금) * 1.05) +
    `<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub)"><span>저 ${X.eok(m.저)}</span><span>고 ${X.eok(m.고)}</span><span><b style="color:var(--ink)">지금 ${X.eok(m.지금)}</b></span></div>` +
    `<table><tr><th style="width:30%">항목</th><th>이 단지</th><th>생활권 평균 <small style="display:inline">(${n}곳)</small></th></tr>` +
    `<tr><td>하락기 낙폭<small>전고점→전저점</small></td><td><b class="down">${X.pct(m.낙폭, 1)}</b>${cmp(m.낙폭, av.낙폭, "%p", true)}<small>생활권 ${m.낙폭순위}위 · 서울 ${sD.r}/${sD.n}</small></td><td>${X.pct(av.낙폭, 1)}</td></tr>` +
    `<tr><td>하락기 거래<small>${X.ym(CY.하락기[0])}~${X.ym(CY.하락기[1])}</small></td><td><b>${m.거래}건</b>${cmp(m.거래, av.거래, "건", true)}<small>생활권 ${m.거래순위}위</small></td><td>${av.거래}건</td></tr>` +
    `<tr><td>저점 뒤 상승<small>전저점→지금</small></td><td><b class="up">${X.pct(m.상승률, 1)}</b>${cmp(m.상승률, av.상승률, "%p", true)}<small>생활권 ${m.상승률순위}위 · 서울 ${sR.r}/${sR.n}</small></td><td>${X.pct(av.상승률, 1)}</td></tr>` +
    `<tr><td>회복률<small>(지금−저)÷(고−저)</small></td><td><b>${m.회복률}%</b>${cmp(m.회복률, av.회복률, "%p", true)}</td><td>${Math.round(av.회복률)}%</td></tr></table>` +
    `<div class="sub2" style="margin-top:6px">${r.Z.잘팔린.includes(m.id) ? "★ 생활권 '하락기에도 잘 팔린 단지' 상위 3에 들어감 · " : ""}하락기 = 서울 84㎡ 시세가 정점이던 ${X.ym(CY.하락기[0])}부터 바닥이던 ${X.ym(CY.하락기[1])}까지 (모든 단지 같은 구간)</div></div>`;
  $("rep").innerHTML = h;
}
$("segGuSort").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.guSort = b.dataset.v; save(); renderGu(); };
$("segArea").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.area = b.dataset.v; LIMIT = 30; save(); renderPhase(); renderCx(); const id = X.store.get("silgeorae_cycle_rep", null), x = id && RALL.find(r => r.c.id === id); if (x) showRep(x); };
$("segCx").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.cx = b.dataset.v; LIMIT = 30; save(); renderCx(); };
$("selGu").onchange = e => { S.gu = e.target.value; LIMIT = 30; save(); renderCx(); };
</script>
</body>
