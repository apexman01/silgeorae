<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시세 그룹 시험판</title>
<style>
  :root{
    --ink:#1d1f23; --sub:#5b616b; --mute:#9aa0a8; --line:#e6e8eb; --bg:#f6f7f9; --card:#fff;
    --accent:#2a6fdb; --warm:#c2551f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:18px 16px 48px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
  header h1{font-size:21px;margin:0;letter-spacing:-.3px}
  header a{font-size:13px;color:var(--accent);text-decoration:none}
  .lead{color:var(--sub);font-size:13px;margin:4px 0 0;line-height:1.5}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:#eef1f5;color:#4a5260;font-weight:500;vertical-align:1px}
  .tag.pre{background:#fff1e8;color:var(--warm);font-weight:600}
  .tag.old{background:#f1f2f4;color:var(--mute)}
  .controls{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 12px 4px;margin:14px 0 10px}
  .row{margin-bottom:10px}
  .row > label{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-bottom:5px}
  .price{display:flex;align-items:center;gap:6px}
  .price input{font:inherit;font-size:20px;font-weight:700;width:96px;padding:6px 8px;border:1px solid #d5d9de;border-radius:8px;text-align:right}
  .price span{font-size:16px;font-weight:600}
  .price .rng{margin-left:auto;font-size:13px;color:var(--sub);font-weight:500}
  .chips{display:flex;gap:5px;overflow-x:auto;margin-top:7px;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{font:inherit;font-size:13px;flex:none;border:1px solid #d5d9de;background:#fff;border-radius:999px;padding:5px 11px;color:var(--sub);cursor:pointer}
  .chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .seg{display:flex;border:1px solid #d5d9de;border-radius:8px;overflow:hidden}
  .seg button{font:inherit;font-size:13.5px;flex:1;border:0;background:#fff;padding:8px 4px;cursor:pointer;color:var(--sub);min-height:38px;white-space:nowrap}
  .seg button+button{border-left:1px solid #d5d9de}
  .seg button.on{background:var(--ink);color:#fff}
  .chk{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px;margin:2px 0 10px}
  .sum{font-size:14px;margin:12px 2px 8px;line-height:1.5}
  .sum b{font-size:15px}
  .sum small{display:block;color:var(--mute);font-size:12px}
  .gu{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px}
  .gu span{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--sub)}
  .gu span b{color:var(--ink)}
  .zone{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .zh{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f2f5fa;border-bottom:1px solid var(--line)}
  .zh .rk{flex:none;min-width:38px;text-align:center;font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:3px 4px}
  .zh .zn{flex:1;min-width:0}
  .zh .zn b{font-size:15.5px}
  .zh .zn small{display:block;font-size:12px;color:var(--sub);margin-top:1px}
  .zh .top{flex:none;text-align:right;font-size:11.5px;color:var(--sub);line-height:1.35}
  .zh .top b{display:block;font-size:13.5px;color:var(--ink)}
  .it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
  .zone .it:first-of-type{border-top:0}
  .it .nm{flex:1;min-width:0}
  .it .nm b{font-size:15px;font-weight:600}
  .it .nm small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
  .it .pr{flex:none;text-align:right}
  .it .pr b{font-size:16px}
  .it .pr small{display:block;font-size:11.5px;color:var(--mute);margin-top:1px}
  .it.old .pr b{color:var(--mute)}
  .flat{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .flat .it:first-child{border-top:0}
  .zt{font-size:12px;color:var(--accent);font-weight:600}
  .empty{background:var(--card);border:1px dashed #cfd4da;border-radius:12px;padding:22px 14px;text-align:center;color:var(--sub);font-size:14px;line-height:1.6}
  .foot{color:var(--mute);font-size:12px;line-height:1.6;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>시세 그룹 <span class="tag pre">시험판</span></h1>
    <a href="./">← 생활권 그래프</a>
  </header>
  <p class="lead">같은 가격대 아파트를 생활권 서열 순으로 모아 봅니다. 같은 돈으로 갈 수 있는 가장 높은 생활권을 찾는 용도입니다.</p>

  <div class="controls">
    <div class="row">
      <label for="inPrice">가용 금액 (매매가)</label>
      <div class="price"><input id="inPrice" type="number" inputmode="decimal" min="1" max="200" step="0.5" value="10"><span>억</span><span class="rng" id="rng"></span></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="row">
      <label>여유 범위</label>
      <div class="seg" id="segTol"><button data-v="0">0% (그 억대)</button><button data-v="10">±10%</button><button data-v="20">±20%</button></div>
    </div>
    <div class="two">
      <div class="row"><label>평형</label>
        <div class="seg" id="segArea"><button data-v="59">59㎡</button><button data-v="84">84㎡</button><button data-v="all">모두</button></div></div>
      <div class="row"><label>기준 가격</label>
        <div class="seg" id="segBasis"><button data-v="recent">최근 거래</button><button data-v="max">12개월 최고</button></div></div>
    </div>
    <div class="row"><label>보기</label>
      <div class="seg" id="segView"><button data-v="zone">생활권 서열별</button><button data-v="price">가격순</button></div></div>
    <label class="chk"><input type="checkbox" id="chkOld"> 6개월 넘은 거래는 빼기</label>
  </div>

  <div id="out"><div class="empty">자료를 불러오는 중…</div></div>

  <p class="foot" id="foot"></p>
</div>

<script>
const $ = id => document.getElementById(id);
const KEY = "silgeorae_group_v1";
const S = Object.assign({ price: 10, tol: "10", area: "84", basis: "recent", view: "zone", noOld: false }, (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })());
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

let ITEMS = [], ZONES = [], META = {};

function eok(man) { return (man / 10000).toFixed(2).replace(/\.?0+$/, "") + "억"; }
function ymNum(ym) { return Math.floor(ym / 100) * 12 + (ym % 100); }
function ymTxt(ym) { return String(ym).slice(2, 4) + "." + String(ym).slice(4, 6); }

async function load() {
  const idx = await (await fetch("data/summary/index.json", { cache: "no-cache" })).json();
  META = idx;
  const files = await Promise.all(idx.구.map(g => fetch("data/summary/" + g.파일, { cache: "no-cache" }).then(r => r.json())));
  files.forEach(d => d.생활권.forEach(z => {
    // 생활권 서열 값: 이 생활권 단지들의 84㎡ 12개월 최고가 중 가장 높은 값 (사이트의 생활권 순위와 같은 생각, 기간만 12개월)
    let top = 0, topName = "";
    z.단지.forEach(c => { const v = c["84㎡"] && c["84㎡"]["12개월최고"] ? c["84㎡"]["12개월최고"].가격 : 0; if (v > top) { top = v; topName = c.이름; } });
    const zone = { gu: d.구, name: z.이름, desc: z.설명 || "", top, topName };
    ZONES.push(zone);
    z.단지.forEach(c => ["59㎡", "84㎡"].forEach(a => { if (c[a]) ITEMS.push({ zone, c, a: a.slice(0, 2), d: c[a] }); }));
  }));
  ZONES.sort((x, y) => y.top - x.top).forEach((z, i) => z.rank = z.top ? i + 1 : null);
  $("foot").innerHTML = `자료: 국토부 실거래가 · 기준월 ${ymTxt(idx.기준월)} (갱신 ${idx.자료갱신})<br>` +
    `· 생활권마다 세대수가 많은 대표 단지(약 5개)만 담았습니다. 서울 ${ZONES.length}개 생활권, ${new Set(ITEMS.map(x => x.c)).size}개 단지.<br>` +
    `· 생활권 서열 = 그 생활권 대표 단지의 84㎡ 최근 12개월 최고가 순. 분양권·입주권 거래도 포함하며 따로 표시합니다.<br>` +
    `· 59㎡ = 전용 59㎡ 구간, 84㎡ = 전용 84㎡ 구간 (사이트 그래프와 같은 구간).`;
  render();
}

function range() {
  const p = Math.max(0, +S.price || 0) * 10000, t = +S.tol;
  if (t === 0) { const lo = Math.floor(p / 10000) * 10000; return [lo, lo + 9999]; }
  return [Math.round(p * (1 - t / 100)), Math.round(p * (1 + t / 100))];
}

function render() {
  // 컨트롤 표시
  $("inPrice").value = S.price;
  [["segTol", "tol"], ["segArea", "area"], ["segBasis", "basis"], ["segView", "view"]].forEach(([id, k]) =>
    $(id).querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === String(S[k]))));
  $("chips").querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.v === +S.price));
  $("chkOld").checked = S.noOld;
  const [lo, hi] = range();
  $("rng").textContent = lo ? `${eok(lo)} ~ ${eok(hi + (S.tol === "0" ? 1 : 0))}${S.tol === "0" ? " 미만" : ""}` : "";
  if (!ITEMS.length) return;

  const base = ymNum(META.기준월);
  const rows = ITEMS.filter(x => S.area === "all" || x.a === S.area).map(x => {
    const t = S.basis === "max" ? x.d["12개월최고"] : x.d.최근;
    if (!t) return null;
    return { ...x, t, old: base - ymNum(t.연월) >= 6 };
  }).filter(x => x && x.t.가격 >= lo && x.t.가격 <= hi && !(S.noOld && x.old));

  const out = $("out");
  if (!lo || !rows.length) {
    out.innerHTML = `<div class="empty">이 가격대에 해당하는 단지가 없습니다.<br>여유 범위를 넓히거나 평형을 바꿔 보세요.</div>`;
    return;
  }
  const zs = [...new Set(rows.map(r => r.zone))];
  const gus = {}; rows.forEach(r => gus[r.zone.gu] = (gus[r.zone.gu] || 0) + 1);
  const areaTxt = S.area === "all" ? "59·84㎡" : S.area + "㎡";
  let h = `<div class="sum"><b>${areaTxt} ${$("rng").textContent}</b> · 단지 ${new Set(rows.map(r => r.c)).size}곳 · 생활권 ${zs.length}곳 · ${Object.keys(gus).length}개 구` +
    `<small>위쪽일수록 서열이 높은 생활권입니다. 같은 돈이면 위쪽 생활권이 입지 우위.</small></div>`;
  h += `<div class="gu">` + Object.entries(gus).sort((a, b) => b[1] - a[1]).map(([g, n]) => `<span>${g} <b>${n}</b></span>`).join("") + `</div>`;

  if (S.view === "zone") {
    zs.sort((a, b) => (a.rank || 999) - (b.rank || 999)).forEach(z => {
      const rs = rows.filter(r => r.zone === z).sort((a, b) => b.t.가격 - a.t.가격);
      h += `<div class="zone"><div class="zh"><span class="rk">${z.rank ? z.rank + "위" : "-"}</span>` +
        `<div class="zn"><b>${z.gu} ${z.name}</b><small>${z.desc}</small></div>` +
        (z.top ? `<div class="top">생활권 대장 84㎡<b>${eok(z.top)}</b></div>` : "") + `</div>` +
        rs.map(r => item(r, false)).join("") + `</div>`;
    });
  } else {
    h += `<div class="flat">` + rows.sort((a, b) => b.t.가격 - a.t.가격 || (a.zone.rank || 999) - (b.zone.rank || 999)).map(r => item(r, true)).join("") + `</div>`;
  }
  out.innerHTML = h;
}

function item(r, showZone) {
  const c = r.c, t = r.t, n12 = r.d["12개월거래건수"];
  const info = [c.준공 ? c.준공 + "년" : "", c.세대수 ? c.세대수.toLocaleString() + "세대" : "", n12 ? `12개월 ${n12}건` : ""].filter(Boolean).join(" · ");
  const tags = (t.구분 && t.구분 !== "매매" ? ` <span class="tag pre">${t.구분}</span>` : "") + (r.old ? ` <span class="tag old">오래됨</span>` : "");
  return `<div class="it${r.old ? " old" : ""}"><div class="nm">` +
    (showZone ? `<span class="zt">${r.zone.rank ? r.zone.rank + "위 " : ""}${r.zone.gu} ${r.zone.name}</span><br>` : "") +
    `<b>${c.이름}</b>${S.area === "all" ? ` <span class="tag">${r.a}㎡</span>` : ""}${tags}<small>${info}</small></div>` +
    `<div class="pr"><b>${t.표기}</b><small>${t.연월표기}.${String(t.일).padStart(2, "0")} · ${t.층}층 · ${t.전용}㎡</small></div></div>`;
}

// 컨트롤 연결
$("chips").innerHTML = [5, 7, 8, 10, 12, 15, 18, 20, 25, 30].map(v => `<button data-v="${v}">${v}억</button>`).join("");
$("chips").onclick = e => { const b = e.target.closest("button"); if (!b) return; S.price = +b.dataset.v; save(); render(); };
$("inPrice").oninput = e => { S.price = e.target.value; save(); render(); };
[["segTol", "tol"], ["segArea", "area"], ["segBasis", "basis"], ["segView", "view"]].forEach(([id, k]) =>
  $(id).onclick = e => { const b = e.target.closest("button"); if (!b) return; S[k] = b.dataset.v; save(); render(); });
$("chkOld").onchange = e => { S.noOld = e.target.checked; save(); render(); };

render();
load().catch(() => { $("out").innerHTML = `<div class="empty">자료를 불러오지 못했습니다. 새로고침해 주세요.</div>`; });
</script>
</body>
</html>
