<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 집 진단 시험판</title>
<link rel="stylesheet" href="x.css">
<style>
  .search{position:relative;margin-top:12px}
  .search input{width:100%;font-size:16px;padding:11px 12px;border:1px solid #d5d9de;border-radius:12px;background:#fff}
  .sug{margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .sug button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:#fff;padding:10px 12px;font-size:14.5px}
  .sug button:first-child{border-top:0}
  .sug button small{display:block;font-size:12px;color:var(--mute);margin-top:1px}
  .hd{display:flex;align-items:flex-start;gap:10px}
  .hd .t{flex:1;min-width:0}
  .hd h2{font-size:20px;margin:0}
  .hd small{display:block;font-size:12.5px;color:var(--sub);margin-top:3px}
  .hd .chg{flex:none;font-size:12.5px;border:1px solid #d5d9de;background:#fff;border-radius:8px;padding:6px 10px;color:var(--sub)}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .kpi div{background:var(--bg);border-radius:12px;padding:10px}
  .kpi small{display:block;font-size:11.5px;color:var(--sub)}
  .kpi b{font-size:21px;letter-spacing:-.4px}
  .kpi em{display:block;font-style:normal;font-size:11px;color:var(--mute);margin-top:2px}
  .verdict{border-radius:12px;padding:12px;margin-top:10px;font-size:14.5px;line-height:1.55}
  .verdict.up{background:var(--up-soft)} .verdict.mid{background:#f1f3f5} .verdict.down{background:var(--down-soft)}
  .verdict b{font-size:15.5px}
  .trs{margin-top:6px;font-size:13px}
  .trs div{display:flex;justify-content:space-between;padding:5px 0;border-top:1px dashed var(--line);color:var(--sub)}
  .trs div:first-child{border-top:0}
  .trs b{color:var(--ink)}
  .loc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi em span{font-size:inherit}
  .loc div{background:var(--bg);border-radius:12px;padding:10px}
  .loc small{display:block;font-size:11.5px;color:var(--sub)}
  .loc b{font-size:22px}
  .loc b span{font-size:13px;color:var(--mute);font-weight:500}
  .gauge{height:8px;border-radius:4px;background:#e3e6ea;margin-top:8px;position:relative;overflow:hidden}
  .gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#7ea5e6,#1f4aa8);width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
  .alt{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .alt:first-of-type{border-top:0}
  .alt .rk{flex:none;min-width:40px;text-align:center;font-size:12px;font-weight:700;color:#fff;background:var(--violet);border-radius:6px;padding:3px 4px}
  .alt .nm{flex:1;min-width:0;font-size:14px}
  .alt .nm small{display:block;font-size:12px;color:var(--mute)}
  .alt b{flex:none;font-size:14.5px}
  .links{display:flex;gap:6px;margin-top:10px}
  .links a{flex:1;text-align:center;font-size:13px;font-weight:600;text-decoration:none;border:1px solid #cfdcf3;background:#f2f6fd;border-radius:10px;padding:9px 4px}
  .links a.nv{border-color:#bfe6cf;background:#eefaf3;color:#11873f}
  .warn{font-size:12px;color:var(--warm);margin-top:6px}
  .cin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  .cin label{display:block;font-size:12px;color:var(--sub);font-weight:600}
  .cin label.w{grid-column:1/-1}
  .cin .u{display:flex;align-items:center;border:1px solid #d5d9de;border-radius:10px;background:#fff;margin-top:4px;padding:0 10px}
  .cin input{flex:1;min-width:0;width:100%;border:0;outline:0;font-size:16px;padding:10px 0;background:transparent}
  .cin .u span{flex:none;font-size:13px;color:var(--mute);font-weight:500}
  .res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:12px}
  .res div{background:var(--bg);border-radius:12px;padding:10px}
  .res small{display:block;font-size:11.5px;color:var(--sub)}
  .res b{font-size:21px;letter-spacing:-.4px}
  .res em{display:block;font-style:normal;font-size:11px;color:var(--mute);margin-top:2px}
  .res .main{grid-column:1/-1;background:#eef3fc}
  .res .main b{font-size:26px}
  .why{font-size:13px;margin-top:8px;color:var(--ink)}
  .cliff{background:#fff4e5;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.55}
  .brk div{display:flex;justify-content:space-between;padding:5px 0;border-top:1px dashed var(--line);font-size:13px;color:var(--sub)}
  .brk div:first-child{border-top:0}
  .brk b{color:var(--ink)}
  .rz{border-top:1px solid var(--line);padding:9px 0 4px}
  .rz:first-of-type{border-top:0}
  .rz .h{font-size:14px;font-weight:700}
  .rz .h small{font-size:12px;color:var(--mute);font-weight:500;margin-left:6px}
  .rz a{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;padding:5px 0 5px 8px;font-size:13.5px}
  .rz a .nm{flex:1;min-width:0}
  .rz a .nm small{display:block;font-size:11.5px;color:var(--mute)}
  .rz a b{flex:none;font-size:14px;text-align:right}
  .capd p{font-size:12.5px;color:var(--sub);line-height:1.6;margin:8px 0 0}
  .brk .sm{font-size:11.5px;color:var(--mute);border-top:0;padding-top:0;justify-content:flex-start}
  .capnote{font-size:12px;color:var(--sub);line-height:1.6;margin:10px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>내 집 진단 <span class="tag pre">시험판</span></h1><span class="meta" id="meta"></span></div>
  <p class="lead">내 단지가 지금 어디쯤인지, 사이클·입지 서열·갈아탈 곳을 한 번에 봅니다. 고른 단지는 이 기기에 기억됩니다.</p>
  <div id="pickBox"></div>
  <div id="out"></div>
  <div id="capCard"></div>
  <p class="foot" id="foot"></p>
</div>
<script src="x.js"></script>
<script src="cap.js"></script>
<script src="nav.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = "silgeorae_mine_v1", TKEY = "silgeorae_target_v1";   // 내 집 · 가고 싶은 집 (이 기기에만 저장)
let C, ALL = [], ME = X.store.get(KEY, null), TG = X.store.get(TKEY, null), TPICK = false, ALT_N = 8;

X.get("data/x/cx.json").then(c => {
  C = c; $("meta").textContent = `기준 ${X.ym(c.기준월)}`;
  c.생활권.forEach(z => (c.단지[z.구][z.이름] || []).forEach(x => ALL.push({ z, c: x, id: z.구 + "|" + z.이름 + "|" + x.이름 })));
  $("foot").innerHTML = `자료: 국토부 실거래가. 생활권 대표 단지 ${ALL.length}곳만 진단할 수 있습니다(시세 요약 파일과 같은 단지).<br>` +
    `· 시세 = 4층 이상 매매(분양권·입주권 포함) 최근 12개월 중 최근 3건 중간값. 전세 = 신규 계약 4층 이상 최근 6개월 중간값.<br>` +
    `· 전고점 = 2021~22년 일반 매매 최고가, 전저점 = 그 뒤 일반 매매 최저가(가장 낮은 1건은 급매로 보고 뺌). 분양권·입주권은 사이클 판단에서 뺍니다. 생활권 서열 = 대표 단지 84㎡ 시세 중간값 순.`;
  ME && find(ME) ? show() : pick();
}).catch(e => { $("out").innerHTML = `<div class="empty">자료를 불러오지 못했습니다.</div>`; console.error(e); });

function find(m) { return ALL.find(x => x.id === m.id); }
function searchBox(box, ph, onPick) {   // 단지 검색 (이름·초성)
  box.innerHTML = `<div class="search"><input type="search" placeholder="${ph}" autocomplete="off"><div class="sug" hidden></div></div>`;
  const q = box.querySelector("input"), sug = box.querySelector(".sug"); q.focus();
  q.oninput = () => {
    const t = X.nz(q.value), isC = /^[ㄱ-ㅎ]+$/.test(t);
    const r = t ? ALL.filter(x => isC ? X.cho(X.nz(x.c.이름 + x.c.검색명)).includes(t) : X.nz(x.c.이름 + x.c.검색명 + x.z.이름 + x.z.구).includes(t)).slice(0, 12) : [];
    sug.hidden = !r.length;
    sug.innerHTML = r.map(x => `<button data-id="${X.esc(x.id)}">${X.esc(x.c.이름)}<small>${x.z.구} ${X.esc(x.z.이름)} · ${x.c.준공 || "-"}년${x.c.세대수 ? " · " + x.c.세대수.toLocaleString() + "세대" : ""}</small></button>`).join("");
  };
  sug.onclick = e => { const b = e.target.closest("button"); if (!b) return; onPick(ALL.find(y => y.id === b.dataset.id)); };
}
function pick() {
  $("out").innerHTML = "";
  $("pickBox").innerHTML = `<div id="pb"></div><div class="empty" style="margin-top:12px">내 단지(또는 관심 단지)를 검색해서 고르세요.</div>`;
  searchBox($("pb"), "단지 이름·초성 (예: 고덕그라시움, ㄱㄷㄱㄹ)", x => { ME = { id: x.id, area: x.c["84"] ? "84" : "59" }; X.store.set(KEY, ME); show(); });
}
// 순위: 같은 평형 시세가 높은 순 (생활권 안 / 서울 전체 대표 단지)
function ranks(x, A) {
  const v = x.c[A] && x.c[A].시세; if (!v) return null;
  const all = ALL.filter(y => y.c[A] && y.c[A].시세).map(y => y.c[A].시세), zone = ALL.filter(y => y.z === x.z && y.c[A] && y.c[A].시세).map(y => y.c[A].시세);
  return { z: zone.filter(w => w > v).length + 1, zn: zone.length, s: all.filter(w => w > v).length + 1, sn: all.length };
}
// 가고 싶은 집 카드: 생활권 안 순위 + 내 집과의 가격 차이 추이 (월별 중간값, 거래 없는 달은 앞 달 값으로 이어 봄)
function targetCard(me, A) {
  if (TPICK || !TG || !ALL.find(y => y.id === TG.id)) return `<div class="card rise" style="animation-delay:.26s" id="tgCard"><h2>가고 싶은 집 <small>내 집과 비교 · 이 기기에만 저장</small></h2><div id="tgBox"></div>` +
    (TG && !TPICK ? "" : `<div style="font-size:12.5px;color:var(--mute);margin-top:6px">목표 단지를 고르면 그 생활권 안 순위와, 내 집과의 가격 차이가 어떻게 변해 왔는지 그래프로 보여 줍니다.</div>`) + `</div>`;
  const t = ALL.find(y => y.id === TG.id), TA = t.c[A] ? A : (t.c["84"] ? "84" : "59"), ta = t.c[TA], ma = me.c[A];
  const rk = ranks(t, TA);
  const mm = new Map((ma.월별 || []).map(([m, v]) => [m, v])), tm = new Map((ta.월별 || []).map(([m, v]) => [m, v]));
  const ms = C.월 || [...new Set([...mm.keys(), ...tm.keys()])].sort();
  let lm = null, lt = null; const diff = [];
  ms.forEach((m, i) => { if (mm.has(m)) lm = mm.get(m); if (tm.has(m)) lt = tm.get(m); if (lm != null && lt != null) diff.push([Math.floor(m / 100) * 12 + m % 100, lt - lm, m]); });
  const now = ta.시세 && ma.시세 ? ta.시세 - ma.시세 : null;
  const yAgo = diff.filter(d => d[2] <= (Math.floor(C.확정월 / 100) - 1) * 100 + C.확정월 % 100).pop();
  const lo = diff.length ? Math.min(...diff.map(d => d[1])) : 0, hi = diff.length ? Math.max(...diff.map(d => d[1])) : 0;
  const minD = diff.find(d => d[1] === lo), maxD = diff.find(d => d[1] === hi);
  return `<div class="card rise" style="animation-delay:.26s" id="tgCard"><h2>가고 싶은 집 <small>내 집과 비교 · 이 기기에만 저장</small></h2>` +
    `<div class="hd"><div class="t"><h2 style="font-size:17px">${X.esc(t.c.이름)} <span class="tag">${TA}㎡</span></h2><small>${t.z.구} ${X.esc(t.z.이름)} · 생활권 서열 ${t.z.중간순위 || "-"}위</small></div><button class="chg" id="tgChg">바꾸기</button></div>` +
    `<div class="kpi"><div><small>목표 시세</small><b class="num">${X.eok(ta.시세)}</b><em>${ta.시세근거 ? ta.시세근거.층조건 + " 최근 " + ta.시세근거.건수 + "건 중간값" : "-"}</em></div>` +
    `<div><small>지금 가격 차이</small><b class="num ${now > 0 ? "up" : "down"}">${now == null ? "-" : (now > 0 ? "+" : "−") + X.eok(Math.abs(now))}</b><em>목표 − 내 집</em></div>` +
    `<div><small>생활권 안 순위</small><b class="num">${rk ? rk.z : "-"}<span style="font-size:13px;color:var(--mute)"> / ${rk ? rk.zn : "-"}</span></b><em>${t.z.이름} 대표 단지 ${TA}㎡ 시세 순</em></div>` +
    `<div><small>서울 순위</small><b class="num">${rk ? rk.s : "-"}<span style="font-size:13px;color:var(--mute)"> / ${rk ? rk.sn : "-"}</span></b><em>서울 대표 단지 ${TA}㎡</em></div></div>` +
    (diff.length > 2 ? `<div class="lbl" style="margin:12px 0 4px">가격 차이 추이 <small style="font-weight:400;color:var(--mute)">(목표 − 내 집, 월별 중간값)</small></div>` +
      X.spark(diff.map(d => [d[0], d[1]]), { w: 600, h: 140, c: "#7a4fd6", fill: "#efe9fb", lines: [{ y: 0, c: "#9aa0a8", t: "차이 0" }], extra: [0] }) +
      `<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mute)"><span>${X.ym(diff[0][2])}</span><span>${X.ym(diff[diff.length - 1][2])}</span></div>` +
      `<p style="font-size:12.5px;color:var(--sub);margin:8px 0 0;line-height:1.55">가장 좁았을 때 ${X.eok1(minD[1])}(${X.ym(minD[2])}) · 가장 벌어졌을 때 ${X.eok1(maxD[1])}(${X.ym(maxD[2])})${yAgo ? ` · 1년 전 ${X.eok1(yAgo[1])}` : ""}. 그 달 거래가 없으면 앞 달 값으로 이어 계산합니다.</p>` : `<div style="font-size:13px;color:var(--sub);margin-top:10px">두 단지 모두 거래가 있는 달이 적어 추이를 그리기 어렵습니다.</div>`) +
    `</div>`;
}

function show() {
  $("pickBox").innerHTML = "";
  const x = find(ME), c = x.c, z = x.z;
  const areas = ["59", "84"].filter(a => c[a]);
  if (!c[ME.area]) ME.area = areas[0];
  const a = c[ME.area];
  const gap = a.시세 && a.전세 ? a.시세 - a.전세[0] : null;
  const jr = a.시세 && a.전세 ? a.전세[0] / a.시세 * 100 : null;
  const pk = a.전고점 && a.전고점[0], lo = a.전저점 && a.전저점[0], cur = a.시세;
  const rec = pk && lo != null && cur && pk > lo ? (cur - lo) / (pk - lo) * 100 : null;
  const vs = pk && cur ? (cur / pk - 1) * 100 : null;
  const WHY = { "신축": "신축 단지라 2021~22년 일반 매매가 거의 없습니다(분양권 거래만 있음).", "입주권": "거래 대부분이 입주권입니다(정비사업 진행, 아직 준공 전).", "신축입주권": "입주권 시절에 지은 신축이라 2021~22년 일반 매매가 거의 없습니다.", "거래부족": "2021~22년 일반 매매가 2건 미만이라 전고점을 정하기 어렵습니다.", "저≥고": "전고점 뒤 가장 낮은 거래가 전고점보다 높아 하락기가 없었던 것으로 보입니다." };
  let vcls = "mid", vtxt = `<b>사이클 판단 불가</b><br>${a.사이클 && WHY[a.사이클.이유] || "2021~22년 일반 매매가 부족합니다."}`;
  if (a.사이클 && a.사이클.이유 === "입주권") vtxt = `<b>정비사업 진행</b><br>${WHY["입주권"]} 사이클 판단에서 뺍니다. <a href="./?gu=${encodeURIComponent(z.구)}&lz=${encodeURIComponent(z.id || z.이름)}&tab=jb">${X.esc(z.이름)} 정비사업 보기 →</a>`;
  if (vs != null) {
    if (cur > pk) { vcls = "up"; vtxt = `<b>상승기 — 전고점 돌파</b><br>2021~22년 최고가 ${X.eok(pk)}보다 <b class="up">${X.pct(vs)}</b> 높습니다.`; }
    else if (rec != null && rec >= 40) { vtxt = `<b>회복 중</b><br>전고점까지 <b>${X.eok(pk - cur)}</b> 남았습니다. 떨어졌던 폭의 ${rec.toFixed(0)}%를 되찾았습니다.`; }
    else { vcls = "down"; vtxt = `<b>바닥권</b><br>전고점 대비 <b class="down">${X.pct(vs)}</b>. 떨어졌던 폭의 ${rec == null ? "-" : rec.toFixed(0) + "%"}만 회복했습니다.`; }
  }
  // 입지
  const nZ = C.생활권.filter(q => q.중간순위).length;
  const guZ = C.생활권.filter(q => q.구 === z.구 && q.중간순위).sort((p, q) => p.중간순위 - q.중간순위);
  const inGu = guZ.findIndex(q => q === z) + 1;
  // 같은 금액대: 같은 평형, 시세 ±5%, 다른 생활권 전체 (서열 높은 순)
  const altAll = cur ? ALL.filter(y => y.z !== z && y.c[ME.area] && y.c[ME.area].시세 && Math.abs(y.c[ME.area].시세 / cur - 1) <= 0.05).sort((p, q) => (p.z.중간순위 || 999) - (q.z.중간순위 || 999)) : [];
  const alts = altAll.slice(0, ALT_N), nUp = altAll.filter(y => y.z.중간순위 && z.중간순위 && y.z.중간순위 < z.중간순위).length;
  const myRk = ranks(x, ME.area);
  const ser = (a.월별 || []).map(([m, v]) => [Math.floor(m / 100) * 12 + m % 100, v]);
  const lines = []; if (pk) lines.push({ y: pk, c: "#d9443a", t: "전고점 " + X.eok1(pk) }); if (lo) lines.push({ y: lo, c: "#2a6fdb", t: "전저점 " + X.eok1(lo) });
  const tr = a.시세근거 ? a.시세근거.거래.slice().reverse() : [];

  $("out").innerHTML =

    (groups.length ? groups.slice(0, REC_N).map(([z, l]) => `<div class="rz"><div class="h">${X.esc(z.이름)}<small>${z.구} · 상단 ${X.eok1(z.대장)} · 서열 ${z.중간순위 || "-"}위</small></div>` +
      l.sort((p, q) => q.a.시세 - p.a.시세).map(({ y, A, a }) => { const cy = a.사이클 && a.사이클.판정 === "가능";
        return `<a href="${y.c.id ? "cycle.html?cx=" + encodeURIComponent(y.c.id) : "./?gu=" + encodeURIComponent(z.구) + "&lz=" + encodeURIComponent(z.id || z.이름) + "&tab=view"}"><span class="nm">${X.esc(y.c.이름)} <span class="tag">${A}㎡</span><small>${cy ? `하락기 거래 ${a.하락기 ? a.하락기.거래 : "-"}건 · 낙폭 ${a.낙폭 != null ? a.낙폭 + "%" : "-"} · 저점 뒤 ${a.상승률 != null ? "+" + Math.round(a.상승률) + "%" : "-"}` : "사이클 판단 불가 · " + (WHYS[a.사이클 && a.사이클.이유] || "-")}</small></span><b class="num">${X.eok1(a.시세)}${a.시세 > P ? `<small style="display:block;font-size:10.5px;font-weight:500;color:var(--warm)">가능 가격보다 ${X.eok1(a.시세 - P)} 위</small>` : ""}</b></a>`; }).join("") + `</div>`).join("") +
      (groups.length > REC_N ? `<button class="chg" id="recMore" style="width:100%;margin-top:8px">더 보기 (${groups.length - REC_N}곳 더)</button>` : "")
    : `<div style="font-size:13.5px;color:var(--sub)">±5% 안에 생활권 대표 단지가 없습니다.</div>`) +
    `<p class="capnote">사이클 성적: ${(() => { const w = (ALL.map(y => y.c["84"] && y.c["84"].하락기).find(Boolean) || {}).구간; return w ? `서울 하락기 ${X.ym(w[0])}~${X.ym(w[1])}` : "하락기"; })()} 거래 = 서울 하락기 일반 매매 건수, 낙폭 = 전고점→전저점. <b>입주권(정비사업 진행 단지)은 총 매매가 = 초기 투자금 + 승계 이주비 + 분담금 구조라 이번 계산에서 뺐습니다(입주권은 별도 계산 예정).</b></p>`;
  o.innerHTML = h;
  const m = $("recMore"); if (m) m.onclick = () => { REC_N += 10; capRender(); };
}
</script>
</body>
</html>
